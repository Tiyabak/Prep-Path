<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login / Sign Up - Digital Planner</title>

  <style>
    :root {
      --primary-color: #a1c4fd;
      --secondary-color: #c2e9fb;
      --light-color: #ffffff;
      --border-color: #dddddd;
      --text-color: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--light-color);
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 1.2s ease;
      position: relative;
    }

    @keyframes fadeIn {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      font-size: 2.2rem;
    }

    form {
      display: none;
      flex-direction: column;
      gap: 1.2rem;
    }

    form.active {
      display: flex;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    input {
      padding: 0.9rem;
      border: 1px solid var(--border-color);
      border-radius: 0.8rem;
      background: #fafafa;
      font-size: 1rem;
      color: var(--text-color);
      transition: 0.3s;
    }

    input:focus {
      border-color: var(--primary-color);
      background: #fff;
      outline: none;
    }

    button {
      background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
      border: none;
      padding: 0.9rem;
      border-radius: 0.8rem;
      font-size: 1.1rem;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.4s ease;
    }

    button:hover {
      background: linear-gradient(to right, #89f7fe, #66a6ff);
    }

    .switch-link {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #666666;
      cursor: pointer;
      text-decoration: underline;
    }

    .switch-link:hover {
      color: var(--primary-color);
    }
  </style>
</head>

<body>

  <div class="container">
    <h2 id="formTitle">Login</h2>

    <form id="loginForm" class="active">
      <input type="text" id="loginUsername" placeholder="Username" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="signupForm">
      <input type="text" id="signupUsername" placeholder="Create Username" required>
      <input type="password" id="signupPassword" placeholder="Create Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <div class="switch-link" id="switchLink">Don't have an account? Sign Up</div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const formTitle = document.getElementById('formTitle');
    const switchLink = document.getElementById('switchLink');

    switchLink.addEventListener('click', () => {
      if (loginForm.classList.contains('active')) {
        loginForm.classList.remove('active');
        signupForm.classList.add('active');
        formTitle.textContent = "Sign Up";
        switchLink.textContent = "Already have an account? Login";
      } else {
        signupForm.classList.remove('active');
        loginForm.classList.add('active');
        formTitle.textContent = "Login";
        switchLink.textContent = "Don't have an account? Sign Up";
      }
    });

    signupForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value;
      const password = document.getElementById('signupPassword').value;

      localStorage.setItem('username', username);
      localStorage.setItem('password', password);

      alert('🎉 Sign Up Successful! Now login.');
      signupForm.reset();
      signupForm.classList.remove('active');
      loginForm.classList.add('active');
      formTitle.textContent = "Login";
      switchLink.textContent = "Don't have an account? Sign Up";
    });

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      const storedUsername = localStorage.getItem('username');
      const storedPassword = localStorage.getItem('password');

      if (username === storedUsername && password === storedPassword) {
        localStorage.setItem('isLoggedIn', 'true');
        alert('🎉 Login Successful!');
        window.location.href = 'home.html'; // change this if needed
      } else {
        alert('❌ Invalid credentials.');
      }
    });
  </script>

</body>
</html>
